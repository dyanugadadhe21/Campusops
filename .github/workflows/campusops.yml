name: CampusOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-release:

    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2️⃣ Get version from tag or default
    - name: Set Version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        else
          echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
        fi

    # 3️⃣ Get commit SHA
    - name: Get Short SHA
      run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

    # 4️⃣ Login Docker (optional for now)
    - name: Docker Login
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 5️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t campusops:${{ env.VERSION }} .
        docker tag campusops:${{ env.VERSION }} campusops:${{ env.SHA }}

    # 6️⃣ Push Docker Image
    - name: Push Image
      run: |
        docker push campusops:${{ env.VERSION }}
        docker push campusops:${{ env.SHA }}

    # 7️⃣ Create GitHub Release
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.VERSION }}
        name: CampusOps Release ${{ env.VERSION }}
        body: |
          🚀 CampusOps Auto Release
          🔖 Version: ${{ env.VERSION }}
          🧠 Commit: ${{ env.SHA }}
          ⚙️ Built via GitHub Actions