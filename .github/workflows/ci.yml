name: CampusOps CI/CD Pipeline (GHCR)

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Set image name
      - name: Set Image Name
        run: echo "IMAGE=ghcr.io/${{ github.repository_owner }}/campusops" >> $GITHUB_ENV

      # 3️⃣ Login to GHCR
      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # 4️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE:latest .
          docker tag $IMAGE:latest $IMAGE:${{ github.sha }}

      # 5️⃣ Push Docker image to GHCR
      - name: Push Docker Image
        run: |
          docker push $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}

      # 6️⃣ Run container test
      - name: Run Container Test
        run: |
          docker run -d -p 5000:5000 $IMAGE:latest
          sleep 5
          curl http://localhost:5000 || true

      # 7️⃣ Save build artifact (LOG FILE)
      - name: Save Artifact
        run: |
          mkdir artifacts
          echo "Build successful for $IMAGE:${{ github.sha }}" > artifacts/build-info.txt
          echo "Timestamp: $(date)" >> artifacts/build-info.txt

      # 8️⃣ Upload artifact to GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusops-build-artifact
          path: artifacts/

      # 9️⃣ Success message
      - name: Success Message
        run: echo "🚀 Build, Push, Test + Artifacts completed successfully"