name: CampusOps Phase 1 - CI Pipeline with Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Set Version
      - name: Set Version Info
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      # Get Short SHA
      - name: Get Commit SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Setup Docker
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t campusops:${VERSION} .
          docker tag campusops:${VERSION} campusops:${SHA}

      # Create Build Artifact
      - name: Create Artifact Folder
        run: |
          mkdir artifacts

          echo "CampusOps Build Successful" > artifacts/build-info.txt
          echo "================================" >> artifacts/build-info.txt
          echo "Version: ${VERSION}" >> artifacts/build-info.txt
          echo "Commit SHA: ${GITHUB_SHA}" >> artifacts/build-info.txt
          echo "Short SHA: ${SHA}" >> artifacts/build-info.txt
          echo "Repository: ${GITHUB_REPOSITORY}" >> artifacts/build-info.txt
          echo "Timestamp: $(date)" >> artifacts/build-info.txt

      # Upload Artifact
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusops-build-artifact-${{ env.VERSION }}
          path: artifacts/
          retention-days: 7

      # Success Message
      - name: Success Message
        run: |
          echo "🚀 Phase 1 CI completed successfully"
          echo "📦 Artifact Version: ${VERSION}"
          echo "🔖 Commit: ${SHA}"