name: CampusOps Phase 1 - CI Pipeline with Artifacts

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Get version (tag or dev build)
      - name: Set Version Info
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      # 3️⃣ Get short SHA
      - name: Get Commit SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4️⃣ Setup Docker Build Environment
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5️⃣ Build Docker Image (LOCAL ONLY - Phase 1 requirement)
      - name: Build Docker Image
        run: |
          docker build -t campusops:$VERSION .
          docker tag campusops:$VERSION campusops:$SHA

      # 6️⃣ Save build output as artifact
      - name: Create Artifact Folder
        run: |
          mkdir artifacts
          echo "CampusOps Build Successful" > artifacts/build-info.txt
          echo "Version: $VERSION" >> artifacts/build-info.txt
          echo "Commit SHA: $SHA" >> artifacts/build-info.txt
          echo "Timestamp: $(date)" >> artifacts/build-info.txt

      # 7️⃣ Upload artifact to GitHub
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: campusops-build-artifact-${{ env.VERSION }}
          path: artifacts/

      # 8️⃣ Optional: Tag info message
      - name: Success Message
        run: echo "🚀 Phase 1 CI completed with artifacts + Docker build"