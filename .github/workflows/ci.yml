name: CampusOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2️⃣ Set version
      - name: Set Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      # 3️⃣ Get short SHA
      - name: Get SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 4️⃣ Docker login (IMPORTANT)
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5️⃣ Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campusops1:latest .
          docker tag ${{ secrets.DOCKER_USERNAME }}/campusops1:latest ${{ secrets.DOCKER_USERNAME }}/campusops1:${{ env.SHA }}

      # 6️⃣ Push Docker image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campusops1:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/campusops1:${{ env.SHA }}

      # 7️⃣ Success message
      - name: Success Message
        run: echo "🚀 Docker image built and pushed successfully!"