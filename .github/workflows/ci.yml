name: CampusOps CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=dev-${GITHUB_SHA::7}" >> $GITHUB_ENV
          fi

      - name: Get SHA
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/campusops:${{ env.VERSION }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/campusops:${{ env.VERSION }} ${{ secrets.DOCKER_USERNAME }}/campusops:${{ env.SHA }}

      - name: Push Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/campusops:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/campusops:${{ env.SHA }}

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION }}
          name: CampusOps Release ${{ env.VERSION }}
          body: |
            🚀 CampusOps Auto Release
            🔖 Version: ${{ env.VERSION }}
            🧠 Commit: ${{ env.SHA }}